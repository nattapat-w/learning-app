# Render Blueprint — API + PostgreSQL
# Dashboard: New → Blueprint → connect this repo
# Or merge services manually using the settings below.

databases:
  - name: learning-app-db
    plan: free
    databaseName: reddit
    user: reddit

services:
  - type: web
    name: learning-app-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: cd ../.. && corepack enable && pnpm install --filter api... --prod=false && pnpm --filter api build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: learning-app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEB_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        sync: false
